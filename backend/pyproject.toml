[project]
name = "k2-rag"
version = "0.1.0"
description = "K2-RAG: cited Q&A over Indonesian electrical safety regulations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pydantic-ai-slim[openai]",
  "pydantic-evals",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "pymupdf>=2.1",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "types-pyyaml"]

[project.scripts]
k2 = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # Depends(); long lines are left to the formatter
exclude = ["migrations"]
per-file-ignores = {}

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
