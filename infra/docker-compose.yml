# Production skeleton (finalized in phase 6: Dockerfiles, healthchecks, security review).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [APP_DOMAIN]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [web, api]
  web:
    build: ../frontend
    restart: unless-stopped
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db: {condition: service_healthy}
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: k2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: k2rag
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k2 -d k2rag"]
      interval: 10s
      retries: 10
volumes:
  caddy_data:
  pgdata:
